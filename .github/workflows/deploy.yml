name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_PATH: /var/www/ali-proj

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload built assets
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            public/build/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.APP_PATH }}/public/build/

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -se <<'REMOTE'
          set -euo pipefail
          cd /var/www/ali-proj

          git fetch origin master
          git reset --hard origin/master

          export COMPOSER_ALLOW_SUPERUSER=1
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

          trap 'php artisan up || true' EXIT
          php artisan down --retry=60 || true
          php artisan migrate --force
          php artisan storage:link || true
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan queue:restart || true

          chown -R www-data:www-data storage bootstrap/cache
          chmod -R ug+rwX storage bootstrap/cache
          REMOTE
